# This workflow only validates documentation builds; Read the Docs builds and publishes the docs.
name: Check Doc Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[doc]"

      - name: Build documentation
        # Validate the build only; deployment is handled by Read the Docs.
        run: sphinx-build -W --keep-going -b html docs/source "$RUNNER_TEMP/docs-html"
